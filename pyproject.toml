# Dev tooling only (ruff, pytest). The app itself is json4win/ with json4win/requirements.txt.

[tool.ruff]
target-version = "py313"
line-length = 100
# json4win/ is the app root: its json4win/ (code) and tests/ packages are first-party everywhere.
src = [".", "json4win"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["json4win/tests"]
pythonpath = ["json4win"]
